<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Kitchen</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/recipie-generator/">
<script>
  // Any mistyped address under the site goes to the home page, keeping a shared recipe (#recipe=...) if there is one.
  // Log the mistyped address to GoatCounter as an event (not a page view), then redirect.
  try { fetch("https://ewannnnnn.goatcounter.com/count?e=true&p=" + encodeURIComponent("Typed: " + location.pathname) + "&t=" + encodeURIComponent("Wrong address, redirected") + "&r=" + encodeURIComponent(document.referrer) + "&rnd=" + Math.random(), { mode: "no-cors", keepalive: true, credentials: "omit" }); } catch (e) {}
  location.replace("/recipie-generator/" + location.search + location.hash);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f9; color: #16213a; font: 17px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
  a { color: #1f3a68; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #0f1522; color: #e6ebf3; } a { color: #8fb0e8; } }
</style>
</head>
<body>
<p>Taking you to Test Kitchen…<br><a href="/recipie-generator/">Tap here if nothing happens</a></p>
</body>
</html>
